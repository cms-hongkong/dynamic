<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐘 力度大冒險：大象 vs 小鳥 🐦</title>
    <style>
        :root {
            --elephant-color: #8D6E63;
            --bird-color: #AED581;
            --bg-color: #FFFDE7;
            --primary-color: #FFB300;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 畫面切換控制 */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }
        .screen.active { display: flex; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 標題區 */
        .header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2.5rem; color: #4E342E; margin-bottom: 5px; }
        p.subtitle { font-size: 1.2rem; color: #795548; }

        /* 元件樣式 */
        input[type="text"] {
            padding: 15px; font-size: 1.5rem; border: 3px solid var(--primary-color);
            border-radius: 15px; text-align: center; width: 80%; max-width: 300px; margin-bottom: 20px;
        }

        .level-btn {
            padding: 15px 30px; font-size: 1.2rem; margin: 10px; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.2s;
            background-color: white; border: 3px solid var(--primary-color); color: #333;
        }
        .level-btn:hover { background-color: var(--primary-color); color: white; transform: scale(1.05); }

        /* 視覺教具區 (遊戲中) */
        .teaching-cards { display: flex; gap: 20px; width: 100%; justify-content: center; margin-bottom: 30px; }
        .card {
            flex: 1; border-radius: 30px; padding: 20px; text-align: center;
            transition: all 0.2s ease; border: 8px solid transparent; opacity: 0.6;
            cursor: pointer; /* 提示可以點擊 */
            transform: scale(0.95);
        }
        .card:hover { opacity: 0.9; transform: scale(1); }

        .elephant-card { background-color: var(--elephant-color); color: white; border-color: #5D4037; }
        .bird-card { background-color: var(--bird-color); color: #33691E; border-color: #7CB342; }

        /* 答對與答錯的特效 */
        .card.correct { 
            opacity: 1; transform: scale(1.05); 
            box-shadow: 0 0 30px 10px #4CAF50; /* 綠色光芒 */
            border-color: #4CAF50;
        }
        .card.wrong { 
            opacity: 1; transform: scale(1.05); 
            box-shadow: 0 0 30px 10px #F44336; /* 紅色光芒 */
            border-color: #F44336;
            animation: shake 0.3s;
        }

        .emoji-large { font-size: 5rem; display: block; margin: 10px 0; }
        .symbol { font-size: 3rem; font-weight: bold; font-family: "Times New Roman", serif; font-style: italic; }

        .progress { font-size: 1.5rem; font-weight: bold; color: #E91E63; margin-bottom: 10px; }
        .instruction { font-size: 1.2rem; color: #1976D2; font-weight: bold; margin-bottom: 20px; }

        /* 評估與排行榜 */
        .eval-btn { font-size: 1.5rem; padding: 20px; margin: 10px; border-radius: 20px; border: none; cursor: pointer; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .eval-btn:hover { transform: scale(1.05); background: #E3F2FD; }

        .leaderboard-table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .leaderboard-table th, .leaderboard-table td { padding: 15px; text-align: center; border-bottom: 1px solid #EEE; }
        .leaderboard-table th { background-color: var(--primary-color); color: white; }

        .feedback-box { background: #E1F5FE; padding: 20px; border-radius: 15px; border-left: 5px solid #0288D1; font-size: 1.2rem; line-height: 1.6; margin-bottom: 20px; width: 100%; }

        @keyframes shake { 0% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐘 力度大冒險 🐦</h1>
        <p class="subtitle">聽聽看，是大力 f 還是輕輕 p？</p>
    </div>

    <!-- 畫面 1：登入與分層 -->
    <div id="screen-login" class="screen active">
        <h2>請輸入冒險者的名字：</h2>
        <input type="text" id="playerName" placeholder="例如：小明" autocomplete="off">
        
        <h2>選擇挑戰難度：</h2>
        <div>
            <button class="level-btn" onclick="startGame(1)">🌱 等級 1 (慢速: 8秒)</button>
            <button class="level-btn" onclick="startGame(2)">🏃 等級 2 (中速: 5秒)</button>
            <button class="level-btn" onclick="startGame(3)">🔥 等級 3 (飛速: 2秒)</button>
        </div>
    </div>

    <!-- 畫面 2：遊戲進行中 -->
    <div id="screen-game" class="screen">
        <div id="progress" class="progress">回合: 1 / 10 | 得分: 0</div>
        <div class="instruction">👂 仔細聽，然後點擊正確的動物！</div>
        
        <div class="teaching-cards">
            <!-- 加入 onclick 讓孩子自己點擊選擇 -->
            <div id="card-f" class="card elephant-card" onclick="checkAnswer('f')">
                <span class="emoji-large">🐘</span>
                <h2>大象來了</h2>
                <div class="symbol">f</div>
                <p>強 (Forte)</p>
            </div>
            <div id="card-p" class="card bird-card" onclick="checkAnswer('p')">
                <span class="emoji-large">🐦</span>
                <h2>小鳥來了</h2>
                <div class="symbol">p</div>
                <p>弱 (Piano)</p>
            </div>
        </div>
        
        <button class="level-btn" style="background:#ef5350; color:white; border-color:#b71c1c;" onclick="stopGame()">🛑 提早結束</button>
    </div>

    <!-- 畫面 3：自評畫面 -->
    <div id="screen-eval" class="screen">
        <h2>🎉 冒險完成！</h2>
        <p style="font-size: 1.5rem; color: #E91E63; font-weight: bold;" id="final-score">總得分：0 / 10</p>
        <p style="font-size: 1.2rem;">你覺得這次任務表現如何呢？請自己評分：</p>
        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <button class="eval-btn" onclick="submitEval('😎 輕鬆掌握')">😎 輕鬆掌握<br><span style="font-size:1rem">(我很會控制力氣)</span></button>
            <button class="eval-btn" onclick="submitEval('🤔 有點挑戰')">🤔 有點挑戰<br><span style="font-size:1rem">(有時候會搞錯)</span></button>
            <button class="eval-btn" onclick="submitEval('😵 太快了')">😵 太快了<br><span style="font-size:1rem">(手忙腳亂啦)</span></button>
        </div>
    </div>

    <!-- 畫面 4：排行榜與評語 -->
    <div id="screen-leaderboard" class="screen">
        <div id="system-feedback" class="feedback-box"></div>
        
        <h2>🏆 冒險者排行榜 (Top 5)</h2>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>名字</th>
                    <th>難度</th>
                    <th>得分</th>
                    <th>自評結果</th>
                </tr>
            </thead>
            <tbody id="lb-body">
                <!-- 排行榜內容由 JS 動態生成 -->
            </tbody>
        </table>
        
        <button class="level-btn" onclick="resetToLogin()">🔄 再玩一次</button>
    </div>

    <script>
        // 系統變數
        let playerName = "";
        let currentLevel = 1;
        let speed = 8000;
        let round = 1;
        const totalRounds = 10;
        
        let score = 0;
        let currentTarget = null; // 紀錄當前正確答案 ('f' 或 'p')
        let hasAnswered = false;  // 紀錄本回合是否已作答
        
        let gameInterval = null;
        let audioCtx = null;

        // 初始化 AudioContext
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- 核心修正：延長聲音，200% 音量 ---
        function playSustainedSound(isForte) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.value = 440; // 統一音高 (A4)
            
            // ⚠️ 大象 (f) 音量設為 2.0 (200% 超大聲) ，小鳥 (p) 設為 0.02 (2% 超細聲)
            const targetVolume = isForte ? 2.0 : 0.02; 
            
            const duration = Math.min((speed / 1000) * 0.8, 3); 
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(targetVolume, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(targetVolume, audioCtx.currentTime + duration - 0.5); 
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration); 
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        }

        // 切換畫面
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 開始遊戲
        function startGame(level) {
            const nameInput = document.getElementById('playerName').value.trim();
            if (!nameInput) {
                alert("請先輸入冒險者的名字喔！");
                return;
            }
            
            playerName = nameInput;
            currentLevel = level;
            round = 1;
            score = 0;
            
            // 設定各難度的秒數
            if (level === 1) speed = 8000; // 8秒
            if (level === 2) speed = 5000; // 5秒
            if (level === 3) speed = 2000; // 2秒

            showScreen('screen-game');
            initAudio();
            nextRound();
            
            gameInterval = setInterval(nextRound, speed);
        }

        // 進行下一回合 (出題)
        function nextRound() {
            if (round > totalRounds) {
                stopGame(true);
                return;
            }

            // 更新 UI，重置卡片狀態 (移除發光或震動效果)
            document.getElementById('progress').innerText = `回合: ${round} / ${totalRounds} | 得分: ${score}`;
            document.getElementById('card-f').className = 'card elephant-card';
            document.getElementById('card-p').className = 'card bird-card';
            
            // 開放作答
            hasAnswered = false;
            
            // 隨機決定正確答案
            const isForte = Math.random() > 0.5;
            currentTarget = isForte ? 'f' : 'p';
            
            // 只播放聲音，不再主動亮起卡片
            playSustainedSound(isForte);
            
            round++;
        }

        // 玩家點擊卡片作答
        function checkAnswer(choice) {
            // 如果這回合已經答過，或是遊戲還沒開始出題，就忽略點擊
            if (hasAnswered || currentTarget === null) return;
            
            hasAnswered = true; // 鎖定作答
            const cardF = document.getElementById('card-f');
            const cardP = document.getElementById('card-p');
            const chosenCard = choice === 'f' ? cardF : cardP;

            if (choice === currentTarget) {
                // 答對了！
                score++;
                chosenCard.classList.add('correct'); // 亮綠光
                
                // 即時更新分數顯示 (因為 round 已經在 nextRound 加 1，所以顯示 round-1)
                document.getElementById('progress').innerText = `回合: ${round - 1} / ${totalRounds} | 得分: ${score}`;
            } else {
                // 答錯了！
                chosenCard.classList.add('wrong'); // 亮紅光並震動
            }
        }

        // 結束遊戲
        function stopGame(completed = false) {
            clearInterval(gameInterval);
            currentTarget = null;
            
            if (completed) {
                document.getElementById('final-score').innerText = `總得分：${score} / ${totalRounds}`;
                showScreen('screen-eval');
            } else {
                resetToLogin();
            }
        }

        // 提交自評與儲存紀錄
        function submitEval(evalResult) {
            const feedbackBox = document.getElementById('system-feedback');
            
            // 根據「得分」與「自評」綜合給予評語
            if (score >= 8) {
                feedbackBox.innerHTML = `🌟 <strong>老師評語：</strong>太厲害了 ${playerName}！你拿了 ${score} 分！大象和小鳥的聲音都逃不過你的耳朵，力度控制超級棒！`;
            } else if (score >= 5) {
                feedbackBox.innerHTML = `👍 <strong>老師評語：</strong>${playerName} 做得很棒！拿到 ${score} 分。聽辨大小聲需要很專注，多練習幾次，耳朵會越來越敏銳喔！`;
            } else {
                feedbackBox.innerHTML = `💪 <strong>老師評語：</strong>${playerName} 辛苦了！這次速度可能太快了，建議我們可以先退回「等級 1」慢慢練習聽力，不用著急喔！`;
            }

            saveRecord(evalResult);
            renderLeaderboard();
            showScreen('screen-leaderboard');
        }

        // 處理排行榜資料 (現在加入 Score 紀錄)
        function saveRecord(evalResult) {
            let lb = JSON.parse(localStorage.getItem('musicGameLB')) || [];
            
            const record = {
                name: playerName,
                level: `Lv ${currentLevel}`,
                score: `${score} / 10`,
                evaluation: evalResult
            };
            
            lb.unshift(record); // 加到最前面
            if (lb.length > 5) lb.pop(); // 只保留前 5 名
            
            localStorage.setItem('musicGameLB', JSON.stringify(lb));
        }

        function renderLeaderboard() {
            let lb = JSON.parse(localStorage.getItem('musicGameLB')) || [];
            const tbody = document.getElementById('lb-body');
            tbody.innerHTML = '';
            
            lb.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${row.name}</strong></td>
                    <td>${row.level}</td>
                    <td style="color: #E91E63; font-weight: bold;">${row.score}</td>
                    <td>${row.evaluation}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 返回首頁
        function resetToLogin() {
            document.getElementById('playerName').value = '';
            showScreen('screen-login');
        }
    </script>
</body>
</html>
